name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-targets --locked

      - name: Performance harness and real-socket workload tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          bash -n tests/perf/ci-smoke.sh
          python3 -m unittest -v \
            tests/perf/test_harness.py \
            tests/perf/test_environment.py \
            tests/perf/test_metrics.py \
            tests/perf/workloads/test_workloads.py \
            tests/e2e/test_continuous_attribution.py

  packaging:
    name: Packaging checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate distro matrix
        run: scripts/test-distro-matrix.sh validate

      - name: Validate target matrix
        run: scripts/check-target-matrix.sh validate

      - name: Validate release matrix
        run: python3 scripts/release-matrix.py validate

      - name: Validate init layouts
        run: scripts/test-init-matrix.sh validate

      - name: Validate init manifests
        run: scripts/test-init-matrix.sh manifests

      - name: Container init checks
        run: scripts/test-init-matrix.sh containers-clean
