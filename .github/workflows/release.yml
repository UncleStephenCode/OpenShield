name: Release packages

on:
  push:
    tags:
      # Keep malformed semver-like tags observable: Validation rejects every
      # release tag that does not use the canonical vX.Y.Z form.
      - '*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to package
        required: true
        type: string
      repair_existing_release:
        description: Upload missing files to an already published release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BINFMT_IMAGE: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
  CROSS_VERSION: v0.2.5
  CROSS_SHA256: 642375d1bcf3bd88272c32ba90e999f3d983050adf45e66bd2d3887e8e838bad
  E2E_SERVER_IMAGE: python:3.13-slim@sha256:9d2e5553305c7c7b0097999bb17187c69b921ccd6bc9d40e4bb5ebe652c00285
  NFPM_VERSION: v2.47.0
  NFPM_SHA256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
  RUST_QUALITY_IMAGE: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922

jobs:
  version:
    name: Validation
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      tag_ref_sha: ${{ steps.version.outputs.tag_ref_sha }}
      source_sha: ${{ steps.version.outputs.source_sha }}
      binary_matrix: ${{ steps.release_matrix.outputs.binary_matrix }}
      package_matrix: ${{ steps.release_matrix.outputs.package_matrix }}
      platform_matrix: ${{ steps.release_matrix.outputs.platform_matrix }}
      firewall_matrix: ${{ steps.release_matrix.outputs.firewall_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - id: version
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          TAG="$REQUESTED_TAG"
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=Invalid release tag::Tag $TAG is missing the required 'v' prefix; create v$TAG on the version commit"
            exit 1
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]] || {
            echo "::error title=Invalid release tag::Tag $TAG must look like vX.Y.Z"
            exit 1
          }
          TAG_VERSION="${TAG#v}"
          CARGO_VERSION="$(awk '
            /^\[workspace.package\]/ { in_section=1; next }
            /^\[/ { in_section=0 }
            in_section && /^version[[:space:]]*=/ {
              gsub(/\"/, "", $3); print $3; exit
            }
          ' Cargo.toml)"
          [[ -n "$CARGO_VERSION" ]] || { echo "::error::Cannot read workspace package version"; exit 1; }
          [[ "$TAG_VERSION" == "$CARGO_VERSION" ]] || {
            echo "::error::Tag $TAG_VERSION does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          }
          SOURCE_SHA="$(git rev-parse HEAD)"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Cannot resolve the release source commit"
            exit 1
          }
          TAG_REF_SHA="$(git rev-parse "refs/tags/$TAG")"
          [[ "$TAG_REF_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Cannot resolve the release tag object"
            exit 1
          }
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag_ref_sha=$TAG_REF_SHA" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Validate and emit the release matrix
        id: release_matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release-matrix.py validate
          echo "binary_matrix=$(python3 scripts/release-matrix.py matrix binaries)" >> "$GITHUB_OUTPUT"
          echo "package_matrix=$(python3 scripts/release-matrix.py matrix packages)" >> "$GITHUB_OUTPUT"
          echo "platform_matrix=$(python3 scripts/release-matrix.py matrix platforms)" >> "$GITHUB_OUTPUT"
          echo "firewall_matrix=$(python3 scripts/release-matrix.py matrix firewall)" >> "$GITHUB_OUTPUT"

      - name: Verify pinned image platforms
        shell: bash
        env:
          BINFMT_IMAGE: ${{ env.BINFMT_IMAGE }}
          E2E_SERVER_IMAGE: ${{ env.E2E_SERVER_IMAGE }}
          RUST_QUALITY_IMAGE: ${{ env.RUST_QUALITY_IMAGE }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          declare -A manifest_files=()
          declare -A image_config_files=()
          manifest_number=0
          while IFS=$'\t' read -r image platform; do
            [[ -n "$image" && -n "$platform" ]]
            if [[ -z "${manifest_files[$image]+present}" ]]; then
              manifest_number=$((manifest_number + 1))
              manifest_file="$RUNNER_TEMP/openshield-image-manifest-$manifest_number.json"
              docker buildx imagetools inspect --raw "$image" > "$manifest_file"
              manifest_files["$image"]=$manifest_file
            fi
            IFS=/ read -r platform_os architecture variant unexpected <<< "$platform"
            [[ "$platform_os" == linux && -n "$architecture" && -z "$unexpected" ]] || {
              echo "::error::Invalid release platform: $platform"
              exit 1
            }
            if [[ -n "$variant" ]]; then
              [[ "$architecture" == arm && "$variant" =~ ^v[5-7]$ ]] || {
                echo "::error::Unsupported release platform variant: $platform"
                exit 1
              }
            fi
            platform_found=false
            if jq -e '(.manifests | type) == "array"' \
                "${manifest_files[$image]}" >/dev/null; then
              if jq -e \
                  --arg os "$platform_os" \
                  --arg architecture "$architecture" \
                  --arg variant "$variant" '
                  any(.manifests[];
                    .platform.os == $os and
                    .platform.architecture == $architecture and
                    ($variant == "" or (.platform.variant // "") == $variant))
                ' "${manifest_files[$image]}" >/dev/null; then
                platform_found=true
              fi
            else
              if [[ -z "${image_config_files[$image]+present}" ]]; then
                image_config_file="${manifest_files[$image]}.config.json"
                docker buildx imagetools inspect "$image" \
                  --format '{{json .Image}}' > "$image_config_file"
                image_config_files["$image"]=$image_config_file
              fi
              if jq -e \
                  --arg os "$platform_os" \
                  --arg architecture "$architecture" \
                  --arg variant "$variant" '
                  .os == $os and
                  .architecture == $architecture and
                  ($variant == "" or (.variant // "") == $variant)
                ' "${image_config_files[$image]}" >/dev/null; then
                platform_found=true
              fi
            fi
            [[ "$platform_found" == true ]] || {
              echo "::error::Pinned image $image does not publish $platform"
              exit 1
            }
          done < <(
            {
              jq -r '.platforms[] | [.image, .platform] | @tsv' \
                packaging/ci/release-matrix.json
              jq -r '.binaries[] | [.smoke_image, .smoke_platform] | @tsv' \
                packaging/ci/release-matrix.json
              printf '%s\t%s\n' \
                "$BINFMT_IMAGE" linux/amd64 \
                "$E2E_SERVER_IMAGE" linux/amd64 \
                "$E2E_SERVER_IMAGE" linux/arm64 \
                "$RUST_QUALITY_IMAGE" linux/amd64
              while IFS=$'\t' read -r _ image platform; do
                printf '%s\t%s\n' "$image" "$platform"
              done < <(scripts/test-init-matrix.sh images)
            } | sort -u
          )

  quality:
    name: Quality Gate (containerized)
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.source_sha }}
          persist-credentials: false
      # jq is available on the Ubuntu runner, not in the pinned Rust image.
      # Publication is exercised only through deny-by-default offline stubs.
      - name: Offline release candidate and publication regressions
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s tests/ci -v
      - name: Fetch locked Rust dependencies in an isolated container
        shell: bash
        env:
          RUST_IMAGE: ${{ env.RUST_QUALITY_IMAGE }}
        run: |
          set -euo pipefail
          install -d -m 0755 \
            "$RUNNER_TEMP/openshield-cargo" \
            "$RUNNER_TEMP/openshield-rustup" \
            "$RUNNER_TEMP/openshield-target"
          sudo chown 0:0 \
            "$RUNNER_TEMP/openshield-cargo" \
            "$RUNNER_TEMP/openshield-rustup" \
            "$RUNNER_TEMP/openshield-target"
          sudo chmod 0700 \
            "$RUNNER_TEMP/openshield-cargo" \
            "$RUNNER_TEMP/openshield-rustup" \
            "$RUNNER_TEMP/openshield-target"
          docker pull "$RUST_IMAGE"
          docker run --rm --cap-drop ALL \
            --security-opt no-new-privileges --security-opt label=disable \
            --user 0:0 \
            --env CARGO_HOME=/cargo-cache \
            --env CARGO_TARGET_DIR=/target \
            --env RUSTUP_HOME=/rustup-cache \
            --env HOME=/tmp \
            --mount "type=bind,src=$PWD,dst=/work,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/openshield-cargo,dst=/cargo-cache" \
            --mount "type=bind,src=$RUNNER_TEMP/openshield-rustup,dst=/rustup-cache" \
            --mount "type=bind,src=$RUNNER_TEMP/openshield-target,dst=/target" \
            --tmpfs /tmp:rw,nosuid,nodev,exec,size=256m \
            --workdir /work \
            "$RUST_IMAGE" /bin/bash -euo pipefail -c '
              cp -R --no-preserve=ownership,timestamps /usr/local/rustup/. /rustup-cache/
              rustup component add --toolchain 1.98.0 clippy rustfmt
              cargo fetch --locked
            '

      - name: Run formatting, lint, tests, and packaging validation offline
        shell: bash
        env:
          RUST_IMAGE: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922
        run: |
          set -euo pipefail
          docker run --rm --network none --cap-drop ALL \
            --security-opt no-new-privileges --security-opt label=disable \
            --user 0:0 \
            --env CARGO_HOME=/cargo-cache \
            --env CARGO_TARGET_DIR=/target \
            --env RUSTUP_HOME=/rustup-cache \
            --env HOME=/tmp \
            --mount "type=bind,src=$PWD,dst=/work,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/openshield-cargo,dst=/cargo-cache" \
            --mount "type=bind,src=$RUNNER_TEMP/openshield-rustup,dst=/rustup-cache" \
            --mount "type=bind,src=$RUNNER_TEMP/openshield-target,dst=/target" \
            --tmpfs /tmp:rw,nosuid,nodev,exec,size=256m \
            --workdir /work \
            "$RUST_IMAGE" /bin/bash -euo pipefail -c '
              cargo fmt --all --check
              cargo clippy --workspace --all-targets --locked --offline -- -D warnings
              cargo test --workspace --all-targets --locked --offline
              cc -std=c11 -fsyntax-only -Wall -Wextra -Werror -Wpedantic \
                tests/e2e/native-client.c
              python3 tests/ci/test_release_candidate_artifacts.py
              bash -n tests/perf/ci-smoke.sh
              sh -n tests/e2e/systemd-sandbox.sh
              sh -n tests/e2e/systemd-sandbox-init.sh
              python3 -c "import ast, pathlib; ast.parse(pathlib.Path(\"tests/e2e/systemd-sandbox.py\").read_text())"
              python3 -m json.tool tests/perf/config/ci-smoke.json >/dev/null
              python3 tests/perf/run.py --help >/dev/null
              PYTHONDONTWRITEBYTECODE=1 python3 -m unittest -v \
                tests/perf/test_ci_output.py \
                tests/perf/test_control.py \
                tests/perf/test_harness.py \
                tests/perf/test_environment.py \
                tests/perf/test_metrics.py \
                tests/perf/workloads/test_workloads.py \
                tests/e2e/test_continuous_attribution.py \
                tests/e2e/test_enforcement_strategy.py \
                tests/e2e/test_tcp_session.py \
                tests/e2e/test_learning_sockets.py \
                tests/e2e/test_ipc_client.py \
                tests/e2e/test_downstream_counters.py \
                tests/e2e/test_udp_client.py \
                tests/e2e/test_zypper_refresh.py
              scripts/check-target-matrix.sh validate
              scripts/test-init-matrix.sh validate
            '

  build:
    name: Binaries / ${{ matrix.family }} / ${{ matrix.arch }}
    needs: [version, quality]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.binary_matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.source_sha }}
          persist-credentials: false

      - name: Install Rust target and native build tools
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          USE_CROSS: ${{ matrix.cross }}
        run: |
          set -euo pipefail
          if [[ "$USE_CROSS" != true ]]; then
            sudo apt-get update
            sudo apt-get install -y musl-tools
          fi
          rustup target add "$TARGET"

      - name: Install pinned cross
        if: ${{ matrix.cross }}
        shell: bash
        env:
          EXPECTED_SHA256: ${{ env.CROSS_SHA256 }}
          VERSION: ${{ env.CROSS_VERSION }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cross-${VERSION#v}-x86_64-unknown-linux-gnu.tar.gz"
          extract_dir="$RUNNER_TEMP/cross-${VERSION#v}"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/cross-rs/cross/releases/download/$VERSION/cross-x86_64-unknown-linux-gnu.tar.gz"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$archive" | sha256sum --check --strict -
          mkdir -m 0700 "$extract_dir"
          tar -xzf "$archive" -C "$extract_dir" cross cross-util
          [[ -f "$extract_dir/cross" && ! -L "$extract_dir/cross" ]]
          [[ -f "$extract_dir/cross-util" && ! -L "$extract_dir/cross-util" ]]
          sudo install -m 0755 "$extract_dir/cross" "$extract_dir/cross-util" /usr/local/bin/
          cross --version

      - name: Build release binaries
        shell: bash
        env:
          CRT_STATIC: ${{ matrix.crt_static || false }}
          TARGET: ${{ matrix.target }}
          USE_CROSS: ${{ matrix.cross }}
        run: |
          set -euo pipefail
          if [[ "$USE_CROSS" == true ]]; then
            if [[ "$CRT_STATIC" == true ]]; then
              RUSTFLAGS='-C target-feature=+crt-static' \
                cross build --release --locked --target "$TARGET" \
                  -p openshield-daemon -p openshield-tui
            else
              cross build --release --locked --target "$TARGET" \
                -p openshield-daemon -p openshield-tui
            fi
          else
            cargo build --release --locked --target "$TARGET" \
              -p openshield-daemon -p openshield-tui
          fi

      - name: Verify and stage release binaries
        shell: bash
        env:
          ARCHIVE_TEMPLATE: ${{ matrix.archive_template }}
          EXPECTED_CLASS: ${{ matrix.elf_class }}
          EXPECTED_ENDIAN: ${{ matrix.elf_endian }}
          EXPECTED_MACHINE: ${{ matrix.elf_machine }}
          NATIVE: ${{ matrix.native }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -m 0755 dist
          for binary in openshield-daemon openshield-tui; do
            source="target/$TARGET/release/$binary"
            [[ -f "$source" && ! -L "$source" ]] || {
              echo "::error::Missing or unsafe release binary: $binary"
              exit 1
            }
            elf_class="$(LC_ALL=C readelf -h "$source" | awk -F: '/^[[:space:]]*Class:/ { sub(/^[[:space:]]+/, "", $2); print $2; exit }')"
            elf_data="$(LC_ALL=C readelf -h "$source" | awk -F: '/^[[:space:]]*Data:/ { sub(/^[[:space:]]+/, "", $2); print $2; exit }')"
            elf_machine="$(LC_ALL=C readelf -h "$source" | awk -F: '/^[[:space:]]*Machine:/ { sub(/^[[:space:]]+/, "", $2); print $2; exit }')"
            [[ "$elf_class" == "$EXPECTED_CLASS" \
              && "$elf_data" == *"$EXPECTED_ENDIAN"* \
              && "$elf_machine" == "$EXPECTED_MACHINE" ]] || {
              echo "::error::Unexpected ELF identity for $binary: $elf_class / $elf_data / $elf_machine"
              exit 1
            }
            if LC_ALL=C readelf -l "$source" \
                | grep -E '(^|[[:space:]])INTERP([[:space:]]|$)' >/dev/null; then
              echo "::error::Release binary contains a dynamic ELF interpreter: $binary"
              exit 1
            fi
            if LC_ALL=C readelf -d "$source" | grep -F '(NEEDED)' >/dev/null; then
              echo "::error::Release binary contains a dynamic ELF dependency: $binary"
              exit 1
            fi
            install -m 0755 "$source" "dist/$binary"
          done
          file dist/openshield-daemon dist/openshield-tui
          if [[ "$NATIVE" == true ]]; then
            ./dist/openshield-daemon --version
            ./dist/openshield-tui --version
          fi
          archive=${ARCHIVE_TEMPLATE/\{version\}/$VERSION}
          tar -C dist -cJf "$PWD/dist/$archive" openshield-daemon openshield-tui
          [[ -s "dist/$archive" ]]

      - name: Enable pinned QEMU for emulated binary smoke tests
        if: ${{ matrix.execution_mode == 'qemu-user' }}
        shell: bash
        env:
          BINFMT_IMAGE: ${{ env.BINFMT_IMAGE }}
          EMULATED_ARCH: ${{ matrix.arch }}
          EMULATED_IMAGE: ${{ matrix.smoke_image }}
          EMULATED_PLATFORM: ${{ matrix.smoke_platform }}
        run: |
          set -euo pipefail
          packaging/ci/scripts/enable-qemu.sh \
            "$EMULATED_ARCH" "$EMULATED_PLATFORM" "$EMULATED_IMAGE"

      - name: Run binary smoke test in the target distribution
        shell: bash
        env:
          SMOKE_IMAGE: ${{ matrix.smoke_image }}
          SMOKE_PLATFORM: ${{ matrix.smoke_platform }}
        run: |
          set -euo pipefail
          [[ "$SMOKE_IMAGE" == *@sha256:* ]]
          docker pull --platform "$SMOKE_PLATFORM" "$SMOKE_IMAGE" >/dev/null
          for binary in openshield-daemon openshield-tui; do
            docker run --rm --network none --read-only --cap-drop ALL \
              --security-opt no-new-privileges --security-opt label=disable \
              --platform "$SMOKE_PLATFORM" --pull never \
              --mount "type=bind,src=$PWD/dist,dst=/opt/openshield,readonly" \
              --entrypoint "/opt/openshield/$binary" \
              "$SMOKE_IMAGE" --version
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          # A single directory keeps every downloaded entry at artifact root.
          path: dist/
          if-no-files-found: error
          retention-days: 7

  package:
    name: Packages / ${{ matrix.family }} / ${{ matrix.arch }}
    needs: [version, build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.package_matrix) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.source_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.binary_artifact_name }}
          path: ${{ runner.temp }}/binary-${{ matrix.family }}-${{ matrix.arch }}

      - name: Prepare binaries
        shell: bash
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/binary-${{ matrix.family }}-${{ matrix.arch }}
          EXPECTED_MACHINE: ${{ matrix.expected_elf_machine }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          for binary in openshield-daemon openshield-tui; do
            source="$ARTIFACT_DIR/$binary"
            [[ -f "$source" && ! -L "$source" ]] || {
              echo "::error::Missing or unsafe binary artifact: $binary"
              exit 1
            }
            machine="$(LC_ALL=C readelf -h "$source" | awk -F: '/^[[:space:]]*Machine:/ { sub(/^[[:space:]]+/, "", $2); print $2; exit }')"
            [[ "$machine" == "$EXPECTED_MACHINE" ]] || {
              echo "::error::Unexpected architecture for $binary: $machine (expected $EXPECTED_MACHINE)"
              exit 1
            }
          done
          install -d -m 0755 release-bin
          install -m 0755 "$ARTIFACT_DIR/openshield-daemon" release-bin/openshield-daemon
          install -m 0755 "$ARTIFACT_DIR/openshield-tui" release-bin/openshield-tui
          if [[ "$TARGET_ARCH" == amd64 ]]; then
            ./release-bin/openshield-daemon --version
            ./release-bin/openshield-tui --version
          fi

      - name: Install nFPM
        shell: bash
        env:
          VERSION: ${{ env.NFPM_VERSION }}
          EXPECTED_SHA256: ${{ env.NFPM_SHA256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/nfpm-${VERSION#v}-linux-x86_64.tar.gz"
          extract_dir="$RUNNER_TEMP/nfpm-${VERSION#v}"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/goreleaser/nfpm/releases/download/${VERSION}/nfpm_${VERSION#v}_Linux_x86_64.tar.gz"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$archive" | sha256sum --check --strict -
          mkdir -m 0700 "$extract_dir"
          tar -xzf "$archive" -C "$extract_dir" nfpm
          [[ -f "$extract_dir/nfpm" && ! -L "$extract_dir/nfpm" ]]
          sudo install -m 0755 "$extract_dir/nfpm" /usr/local/bin/nfpm
          nfpm --version

      - name: Build package
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.nfpm_arch }}
          FAMILY: ${{ matrix.family }}
        run: bash packaging/ci/scripts/build-release-package.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  package-test:
    name: Install / ${{ matrix.name }}
    needs: [version, package]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.platform_matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.source_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.package_artifact_name }}
          path: dist
      - name: Install and smoke-test package
        env:
          FAMILY: ${{ matrix.family }}
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
          EXPECTED_PACKAGE_ARCH: ${{ matrix.expected_package_arch }}
          EXPECTED_ELF_MACHINE: ${{ matrix.expected_elf_machine }}
          EXPECTED_VERSION: ${{ needs.version.outputs.version }}
        run: bash packaging/ci/scripts/test-release-package.sh

      - name: Record package-install evidence
        shell: bash
        env:
          EVIDENCE_ID: ${{ matrix.id }}
          EXECUTION_MODE: ${{ matrix.execution_mode }}
          IMAGE: ${{ matrix.image }}
          PACKAGE_ID: ${{ matrix.package }}
          PLATFORM: ${{ matrix.platform }}
          SOURCE_SHA: ${{ needs.version.outputs.source_sha }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          install -d -m 0755 evidence
          mapfile -d '' package_files < <(find dist -mindepth 1 -maxdepth 1 -type f -print0)
          [[ "${#package_files[@]}" -eq 1 && ! -L "${package_files[0]}" ]]
          package_asset=$(basename -- "${package_files[0]}")
          package_sha256=$(sha256sum -- "${package_files[0]}")
          package_sha256=${package_sha256%% *}
          jq -n \
            --arg execution_mode "$EXECUTION_MODE" \
            --arg id "$EVIDENCE_ID" \
            --arg image "$IMAGE" \
            --arg package "$PACKAGE_ID" \
            --arg platform "$PLATFORM" \
            --arg package_asset "$package_asset" \
            --arg package_sha256 "$package_sha256" \
            --arg source_sha "$SOURCE_SHA" \
            --arg version "$VERSION" \
            '{schema_version: 1, type: "package-install", id: $id,
              package: $package, image: $image, platform: $platform,
              execution_mode: $execution_mode, package_asset: $package_asset,
              package_sha256: $package_sha256,
              version: $version, source_sha: $source_sha}' \
            > "evidence/install-$EVIDENCE_ID.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-install-${{ matrix.id }}
          path: evidence/install-${{ matrix.id }}.json
          if-no-files-found: error
          retention-days: 7

  container-tests:
    name: Container tests / init systems
    needs: [version, package-test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.source_sha }}
          persist-credentials: false

      - name: Test non-systemd init integrations in containers
        run: scripts/test-init-matrix.sh containers-clean

      - name: Record init-system evidence
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.version.outputs.source_sha }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          install -d -m 0755 evidence
          init_images=$(scripts/test-init-matrix.sh images | jq -Rsc '
            split("\n")
            | map(select(length > 0) | split("\t"))
            | if length == 6 and all(.[]; length == 3)
              then map({id: .[0], image: .[1], platform: .[2]})
              else error("invalid init image inventory")
              end
          ')
          jq -e '
            length == 6
            and (map(.id) | unique | length == 6)
            and all(.[ ]; (.id | test("^[a-z0-9]+(-[a-z0-9]+)*$"))
              and (.image | test("@sha256:[0-9a-f]{64}$"))
              and .platform == "linux/amd64")
          ' <<< "$init_images" >/dev/null
          init_script_sha256=$(sha256sum scripts/test-init-matrix.sh)
          init_script_sha256=${init_script_sha256%% *}
          jq -n \
            --arg id init-systems \
            --arg script_sha256 "$init_script_sha256" \
            --arg source_sha "$SOURCE_SHA" \
            --arg version "$VERSION" \
            --argjson images "$init_images" \
            '{schema_version: 1, type: "init-systems", id: $id,
              images: $images, script_sha256: $script_sha256,
              version: $version, source_sha: $source_sha}' \
            > evidence/init-systems.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-init-systems
          path: evidence/init-systems.json
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: Firewall E2E / ${{ matrix.name }} / ${{ matrix.backend }}
    needs: [version, package-test, container-tests]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.firewall_matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.source_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.package_artifact_name }}
          path: ${{ runner.temp }}/openshield-e2e-package-${{ matrix.evidence_id }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ matrix.family == 'tumbleweed' && matrix.platform == 'linux/amd64' }}
        with:
          name: binary-tumbleweed-amd64
          path: ${{ runner.temp }}/openshield-strategy-input-${{ matrix.evidence_id }}

      - name: Run isolated firewall E2E
        id: firewall_e2e
        shell: bash
        env:
          BACKEND: ${{ matrix.backend }}
          CLIENT_PLATFORM: ${{ matrix.platform }}
          CLIENT_FAMILY: ${{ matrix.family }}
          CLIENT_IMAGE: ${{ matrix.image }}
          E2E_ARTIFACT_MODE: package
          EXPECTED_VERSION: ${{ needs.version.outputs.version }}
          PACKAGE_DIR: ${{ runner.temp }}/openshield-e2e-package-${{ matrix.evidence_id }}
          E2E_LOG: ${{ runner.temp }}/openshield-e2e-${{ matrix.evidence_id }}.log
          SERVER_IMAGE: ${{ env.E2E_SERVER_IMAGE }}
        run: |
          set -o pipefail
          e2e_status=0
          tests/e2e/server-learning-enforcing.sh "$BACKEND" "$PACKAGE_DIR" \
            2>&1 | tee "$E2E_LOG" || e2e_status=$?
          if (( e2e_status != 0 )); then
            failure_stage="$(grep -F 'OpenShield E2E failed during stage ' "$E2E_LOG" \
              | tail -n 1 || true)"
            if [[ -n "$failure_stage" ]]; then
              printf '::error title=OpenShield %s/%s E2E failed::%s\n' \
                "$CLIENT_FAMILY" "$BACKEND" "$failure_stage"
            fi
          fi
          exit "$e2e_status"

      - name: Prepare exact daemon for the Fast enforcement regression
        if: ${{ matrix.family == 'tumbleweed' && matrix.platform == 'linux/amd64' }}
        shell: bash
        env:
          INPUT_DIRECTORY: ${{ runner.temp }}/openshield-strategy-input-${{ matrix.evidence_id }}
          PREPARED_DIRECTORY: ${{ runner.temp }}/openshield-strategy-binary-${{ matrix.evidence_id }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -d '' daemon_files < <(
            find "$INPUT_DIRECTORY" -mindepth 1 -maxdepth 1 \
              -type f -name openshield-daemon -print0
          )
          [[ "${#daemon_files[@]}" -eq 1 && ! -L "${daemon_files[0]}" ]] || {
            echo '::error::The Tumbleweed x86_64 artifact does not contain one safe daemon'
            exit 1
          }
          install -d -m 0700 "$PREPARED_DIRECTORY"
          install -m 0755 "${daemon_files[0]}" \
            "$PREPARED_DIRECTORY/openshield-daemon"
          actual_version=$("$PREPARED_DIRECTORY/openshield-daemon" --version)
          [[ "$actual_version" == "openshield-daemon $VERSION" ]] || {
            echo "::error::Unexpected enforcement-regression daemon version: $actual_version"
            exit 1
          }
          sha256sum "$PREPARED_DIRECTORY/openshield-daemon"

      - name: Run Learning to Fast Enforcing process-churn regression
        id: enforcement_strategy_e2e
        if: ${{ matrix.family == 'tumbleweed' && matrix.platform == 'linux/amd64' }}
        timeout-minutes: 15
        shell: bash
        env:
          BACKEND: ${{ matrix.backend }}
          DAEMON: ${{ runner.temp }}/openshield-strategy-binary-${{ matrix.evidence_id }}/openshield-daemon
          OPENSHIELD_E2E_CLIENT_IMAGE: ${{ matrix.image }}
          OPENSHIELD_E2E_ISOLATED_VM: "1"
          OPENSHIELD_E2E_PEER_IMAGE: ${{ env.E2E_SERVER_IMAGE }}
        run: sh tests/e2e/enforcement-strategy.sh "$BACKEND" "$DAEMON"

      - name: Preserve Fast enforcement regression evidence
        if: ${{ always() && steps.enforcement_strategy_e2e.outcome != 'skipped' && steps.enforcement_strategy_e2e.outcome != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: enforcement-strategy-${{ matrix.evidence_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/openshield-enforcement-strategy-evidence.*/
          if-no-files-found: error
          retention-days: 7

      - name: Run packaged systemd sandbox regression
        id: systemd_sandbox
        if: ${{ matrix.family == 'tumbleweed' && matrix.platform == 'linux/amd64' }}
        timeout-minutes: 15
        shell: bash
        env:
          BACKEND: ${{ matrix.backend }}
          PACKAGE_DIR: ${{ runner.temp }}/openshield-e2e-package-${{ matrix.evidence_id }}
          SANDBOX_LOG: ${{ runner.temp }}/openshield-systemd-${{ matrix.evidence_id }}.log
        run: |
          set -euo pipefail
          mapfile -d '' packages < <(find "$PACKAGE_DIR" -mindepth 1 -maxdepth 1 -type f -print0)
          [[ "${#packages[@]}" -eq 1 && ! -L "${packages[0]}" && "${packages[0]}" == *.rpm ]]
          # Status 77 (unsupported private systemd/cgroup setup) is not a pass.
          timeout --signal=TERM --kill-after=30s 12m \
            sh tests/e2e/systemd-sandbox.sh "$BACKEND" "${packages[0]}" 2>&1 | tee "$SANDBOX_LOG"

      - name: Preserve packaged systemd evidence
        if: ${{ always() && steps.systemd_sandbox.outcome != 'skipped' && steps.systemd_sandbox.outcome != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: systemd-sandbox-${{ matrix.evidence_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/openshield-systemd-evidence.*/
            ${{ runner.temp }}/openshield-systemd-${{ matrix.evidence_id }}.log
          if-no-files-found: error
          retention-days: 7

      - name: Record firewall evidence
        if: ${{ success() }}
        shell: bash
        env:
          EVIDENCE_ID: ${{ matrix.evidence_id }}
          BACKEND: ${{ matrix.backend }}
          EXECUTION_MODE: ${{ matrix.execution_mode }}
          IMAGE: ${{ matrix.image }}
          PACKAGE_ID: ${{ matrix.package }}
          PLATFORM: ${{ matrix.platform }}
          SOURCE_SHA: ${{ needs.version.outputs.source_sha }}
          VERSION: ${{ needs.version.outputs.version }}
          PACKAGE_DIR: ${{ runner.temp }}/openshield-e2e-package-${{ matrix.evidence_id }}
        run: |
          set -euo pipefail
          install -d -m 0755 evidence
          mapfile -d '' package_files < <(find "$PACKAGE_DIR" -mindepth 1 -maxdepth 1 -type f -print0)
          [[ "${#package_files[@]}" -eq 1 && ! -L "${package_files[0]}" ]]
          package_asset=$(basename -- "${package_files[0]}")
          package_sha256=$(sha256sum -- "${package_files[0]}")
          package_sha256=${package_sha256%% *}
          jq -n \
            --arg backend "$BACKEND" \
            --arg execution_mode "$EXECUTION_MODE" \
            --arg id "$EVIDENCE_ID" \
            --arg image "$IMAGE" \
            --arg package "$PACKAGE_ID" \
            --arg platform "$PLATFORM" \
            --arg package_asset "$package_asset" \
            --arg package_sha256 "$package_sha256" \
            --arg source_sha "$SOURCE_SHA" \
            --arg version "$VERSION" \
            '{schema_version: 1, type: "firewall-e2e", id: $id,
              package: $package, image: $image, platform: $platform,
              backend: $backend, execution_mode: $execution_mode,
              package_asset: $package_asset, package_sha256: $package_sha256,
              version: $version, source_sha: $source_sha}' \
            > "evidence/firewall-$EVIDENCE_ID.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-firewall-${{ matrix.evidence_id }}
          path: evidence/firewall-${{ matrix.evidence_id }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Preserve E2E failure diagnostics
        if: ${{ failure() && steps.firewall_e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-failure-${{ matrix.evidence_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openshield-e2e-${{ matrix.evidence_id }}.log
          if-no-files-found: error
          retention-days: 7

  performance:
    name: Performance gate / Tumbleweed x86_64 / nftables + iptables
    # This job cannot start until every functional firewall matrix entry has
    # succeeded. It is a bounded release gate, not a replacement for E2E.
    needs: [version, build, e2e]
    runs-on: ubuntu-24.04
    # Keep fifteen minutes outside the 1800-second process-group
    # deadline so the wrapper can terminate/clean its labelled Docker resources
    # and Actions can upload bounded failure evidence before the job-level kill.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.source_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-tumbleweed-amd64
          path: ${{ runner.temp }}/openshield-performance-input

      - name: Prepare the exact release daemon
        shell: bash
        env:
          INPUT_DIRECTORY: ${{ runner.temp }}/openshield-performance-input
          PREPARED_DIRECTORY: ${{ runner.temp }}/openshield-performance-binary
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -d '' daemon_files < <(
            find "$INPUT_DIRECTORY" -mindepth 1 -maxdepth 1 \
              -type f -name openshield-daemon -print0
          )
          [[ "${#daemon_files[@]}" -eq 1 && ! -L "${daemon_files[0]}" ]] || {
            echo '::error::The Tumbleweed x86_64 release artifact does not contain one safe daemon'
            exit 1
          }
          install -d -m 0700 "$PREPARED_DIRECTORY"
          install -m 0755 "${daemon_files[0]}" \
            "$PREPARED_DIRECTORY/openshield-daemon"
          actual_version=$(
            "$PREPARED_DIRECTORY/openshield-daemon" --version
          )
          [[ "$actual_version" == "openshield-daemon $VERSION" ]] || {
            echo "::error::Unexpected performance daemon version: $actual_version"
            exit 1
          }
          sha256sum "$PREPARED_DIRECTORY/openshield-daemon"

      - name: Run bounded isolated performance smoke
        id: performance_smoke
        shell: bash
        env:
          OPENSHIELD_DAEMON: ${{ runner.temp }}/openshield-performance-binary/openshield-daemon
          PERF_TIMEOUT_SECONDS: 1800
          PERFORMANCE_OUTPUT: ${{ runner.temp }}/openshield-performance-report
        run: bash tests/perf/ci-smoke.sh "$PERFORMANCE_OUTPUT"

      - name: Upload performance reports
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-ci-smoke-${{ needs.version.outputs.tag }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/openshield-performance-report/report.json
            ${{ runner.temp }}/openshield-performance-report/report.csv
            ${{ runner.temp }}/openshield-performance-report/overload.csv
            ${{ runner.temp }}/openshield-performance-report/report.md
          if-no-files-found: error
          retention-days: 30

      - name: Add the bounded report to the job summary
        if: ${{ !cancelled() && (steps.performance_smoke.outcome == 'success' || steps.performance_smoke.outcome == 'failure') }}
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/openshield-performance-report/report.md
          PERFORMANCE_OUTCOME: ${{ steps.performance_smoke.outcome }}
        run: |
          set -euo pipefail
          readonly maximum_report_bytes=$((512 * 1024))
          {
            printf '%s\n\n' '## OpenShield performance smoke'
            printf 'Performance smoke result: **%s**.\n\n' "$PERFORMANCE_OUTCOME"
            if [[ -f "$REPORT" && ! -L "$REPORT" ]] \
              && report_size=$(stat -c '%s' -- "$REPORT" 2>/dev/null) \
              && [[ "$report_size" =~ ^[0-9]+$ ]] \
              && (( report_size > 0 && report_size <= maximum_report_bytes )); then
              # Bound the read even if the report grows after the size check.
              if ! head -c "$maximum_report_bytes" -- "$REPORT"; then
                printf '\nReport could not be read; inspect the performance step log and failure diagnostics.\n'
              fi
            else
              printf '%s\n' 'Report is missing, empty, unsafe, or larger than 512 KiB; inspect the performance step log and failure diagnostics.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve bounded performance failure diagnostics
        if: ${{ failure() && steps.performance_smoke.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-failure-${{ needs.version.outputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          # The wrapper copies only bounded regular non-symlink files into
          # this private directory before failing. Unbounded runner output is
          # deliberately excluded from artifact collection.
          path: ${{ runner.temp }}/openshield-performance-report/failure-diagnostics/
          if-no-files-found: warn
          retention-days: 7

  release-evidence:
    name: Release evidence and asset inventory
    needs:
      - version
      - build
      - package
      - package-test
      - container-tests
      - e2e
      - performance
    runs-on: ubuntu-24.04
    outputs:
      checksum_manifest_sha256: ${{ steps.candidate_identity.outputs.checksum_manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.source_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: ${{ runner.temp }}/release-input/binaries

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: ${{ runner.temp }}/release-input/packages

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: evidence-*
          path: ${{ runner.temp }}/release-input/evidence
          merge-multiple: true

      - name: Assemble and verify the exact release candidate
        id: candidate_identity
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.version.outputs.source_sha }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/release-matrix.py validate
          python3 scripts/assemble-release-candidate.py \
            --matrix packaging/ci/release-matrix.json \
            --artifacts "$RUNNER_TEMP/release-input" \
            --output release-candidate \
            --version "$VERSION" \
            --tag "$TAG" \
            --source-sha "$SOURCE_SHA"
          scripts/verify-release-candidate.sh \
            release-candidate "$VERSION" "$TAG" "$SOURCE_SHA" \
            packaging/ci/release-matrix.json
          checksum_manifest_sha256=$(sha256sum release-candidate/SHA256SUMS)
          checksum_manifest_sha256=${checksum_manifest_sha256%% *}
          [[ "$checksum_manifest_sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "checksum_manifest_sha256=$checksum_manifest_sha256" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ needs.version.outputs.tag }}
          path: release-candidate/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [version, release-evidence]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ needs.version.outputs.tag }}
          path: release

      - name: Verify the sealed release candidate
        shell: bash
        env:
          EXPECTED_CHECKSUM_MANIFEST_SHA256: ${{ needs.release-evidence.outputs.checksum_manifest_sha256 }}
          SOURCE_SHA: ${{ needs.version.outputs.source_sha }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_CHECKSUM_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          actual_checksum_manifest_sha256=$(sha256sum release/SHA256SUMS)
          actual_checksum_manifest_sha256=${actual_checksum_manifest_sha256%% *}
          [[ "$actual_checksum_manifest_sha256" == "$EXPECTED_CHECKSUM_MANIFEST_SHA256" ]] || {
            echo '::error::Downloaded release candidate differs from the sealed upstream manifest'
            exit 1
          }
          python3 scripts/release-matrix.py validate
          scripts/verify-release-candidate.sh \
            release "$VERSION" "$TAG" "$SOURCE_SHA" \
            packaging/ci/release-matrix.json

      - name: Publish release safely
        shell: bash
        env:
          ALLOW_PUBLISHED_REPAIR: ${{ (github.event_name == 'push' && github.ref_type == 'tag' && github.event.created == true && github.event.deleted == false && github.event.forced == false) || (github.event_name == 'workflow_dispatch' && inputs.repair_existing_release == true) }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TAG_REF_SHA: ${{ needs.version.outputs.tag_ref_sha }}
          SOURCE_SHA: ${{ needs.version.outputs.source_sha }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          command -v jq >/dev/null || {
            echo '::error::jq is required for release manifest verification'
            exit 1
          }
          command -v curl >/dev/null || {
            echo '::error::curl is required for release asset upload'
            exit 1
          }
          [[ "$ALLOW_PUBLISHED_REPAIR" =~ ^(true|false)$ ]] || {
            echo '::error::Invalid published-release repair flag'
            exit 1
          }
          [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || {
            echo '::error::Unsafe GITHUB_REPOSITORY value'
            exit 1
          }

          verify_release_tag() {
            local tag_ref_sha tag_commit_sha
            git fetch --force --no-tags origin "refs/tags/$TAG:refs/tags/$TAG" || return 1
            tag_ref_sha="$(git rev-parse "refs/tags/$TAG")" || return 1
            tag_commit_sha="$(git rev-parse "refs/tags/$TAG^{commit}")" || return 1
            [[ "$tag_ref_sha" == "$EXPECTED_TAG_REF_SHA" ]] || {
              echo "::error::Release tag object $TAG moved from $EXPECTED_TAG_REF_SHA to $tag_ref_sha"
              return 1
            }
            [[ "$tag_commit_sha" == "$SOURCE_SHA" ]] || {
              echo "::error::Release tag $TAG moved from $SOURCE_SHA to $tag_commit_sha"
              return 1
            }
          }

          release_lookup="$RUNNER_TEMP/openshield-release-lookup.json"
          release_json="$RUNNER_TEMP/openshield-release.json"
          remote_assets_json="$RUNNER_TEMP/openshield-release-assets.json"
          remote_assets_tsv="$RUNNER_TEMP/openshield-release-assets.tsv"

          lookup_release() {
            local repository_owner repository_name
            repository_owner="${GITHUB_REPOSITORY%%/*}"
            repository_name="${GITHUB_REPOSITORY#*/}"
            gh api graphql \
              -f query='query($owner:String!,$name:String!,$tag:String!){repository(owner:$owner,name:$name){release(tagName:$tag){id databaseId}}}' \
              -f owner="$repository_owner" \
              -f name="$repository_name" \
              -f tag="$TAG" > "$release_lookup" || return 1
            jq -e \
              '((.errors // []) | length == 0) and (.data.repository != null)' \
              "$release_lookup" >/dev/null || return 1
            release_node="$(jq -r '.data.repository.release.id // empty' "$release_lookup")" || return 1
            release_database_id="$(jq -r '.data.repository.release.databaseId // empty' "$release_lookup")" || return 1
            if [[ -z "$release_node" ]]; then
              [[ -z "$release_database_id" ]] || return 1
            else
              [[ "$release_database_id" =~ ^[0-9]+$ ]] || return 1
            fi
          }

          read_release() {
            [[ "$release_database_id" =~ ^[0-9]+$ ]] || return 1
            gh api "repos/$GITHUB_REPOSITORY/releases/$release_database_id" \
              > "$release_json" || return 1
            release_id="$(jq -er '.id | select(type == "number") | tostring' "$release_json")" || return 1
            release_tag="$(jq -er '.tag_name | select(type == "string")' "$release_json")" || return 1
            release_body="$(jq -er '(.body // "") | select(type == "string")' "$release_json")" || return 1
            release_upload_url="$(jq -er '.upload_url | select(type == "string")' "$release_json")" || return 1
            release_is_draft="$(jq -er '.draft | select(type == "boolean") | if . then "true" else "false" end' "$release_json")" || return 1
            release_is_prerelease="$(jq -er '.prerelease | select(type == "boolean") | if . then "true" else "false" end' "$release_json")" || return 1
            release_is_immutable="$(jq -er '(.immutable // false) | select(type == "boolean") | if . then "true" else "false" end' "$release_json")" || return 1
            [[ "$release_tag" == "$TAG" ]] || {
              echo "::error::GitHub returned release tag $release_tag while $TAG was requested"
              return 1
            }
            expected_upload_url="https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets{?name,label}"
            [[ "$release_upload_url" == "$expected_upload_url" ]] || {
              echo '::error::GitHub returned an unexpected release upload URL'
              return 1
            }
          }

          fetch_remote_assets() {
            gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
              > "$remote_assets_json" || return 1
            jq -e '
              type == "array" and length < 100 and all(.[];
                ((.id | type) == "number") and
                ((.name | type) == "string") and
                ((.size | type) == "number") and
                ((.state | type) == "string") and
                ((.digest == null) or ((.digest | type) == "string"))
              )
            ' "$remote_assets_json" >/dev/null || {
              echo '::error::Invalid or paginated GitHub release asset response'
              return 1
            }
            jq -r '.[] | [.id, .name, .size, .state, (.digest // "")] | @tsv' \
              "$remote_assets_json" > "$remote_assets_tsv" || return 1
          }

          compare_remote_assets() {
            local remote_id name remote_size remote_state remote_digest
            local downloaded_asset downloaded_size downloaded_hash
            declare -A remote_seen=()
            missing_assets=()
            while IFS=$'\t' read -r remote_id name remote_size remote_state remote_digest; do
              [[ "$remote_id" =~ ^[0-9]+$ && "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._+~-]*$ ]] || {
                echo '::error::Unsafe GitHub release asset metadata'
                return 1
              }
              [[ -z "${remote_seen[$name]+present}" ]] || {
                echo "::error::Duplicate GitHub release asset: $name"
                return 1
              }
              remote_seen["$name"]=1
              [[ -n "${local_paths[$name]+present}" ]] || {
                echo "::error::Unexpected GitHub release asset: $name"
                return 1
              }
              [[ "$remote_state" == uploaded ]] || {
                echo "::error::GitHub release asset $name is not fully uploaded"
                return 1
              }
              [[ "$remote_size" == "${local_sizes[$name]}" ]] || {
                echo "::error::GitHub release asset $name has an unexpected size"
                return 1
              }
              if [[ -z "$remote_digest" ]]; then
                downloaded_asset="$RUNNER_TEMP/openshield-release-asset-$remote_id"
                gh api -H 'Accept: application/octet-stream' \
                  "repos/$GITHUB_REPOSITORY/releases/assets/$remote_id" \
                  > "$downloaded_asset" || return 1
                downloaded_size="$(stat -c '%s' -- "$downloaded_asset")" || return 1
                [[ "$downloaded_size" == "$remote_size" ]] || {
                  echo "::error::Downloaded GitHub release asset $name has an unexpected size"
                  return 1
                }
                read -r downloaded_hash _ < <(sha256sum -- "$downloaded_asset") || return 1
                remote_digest="sha256:$downloaded_hash"
              fi
              [[ "$remote_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
                echo "::error::GitHub release asset $name has no trustworthy SHA-256 digest"
                return 1
              }
              [[ "$remote_digest" == "${local_digests[$name]}" ]] || {
                echo "::error::GitHub release asset $name differs from the current build"
                return 1
              }
            done < "$remote_assets_tsv"
            for name in "${local_names[@]}"; do
              if [[ -z "${remote_seen[$name]+present}" ]]; then
                missing_assets+=("$name")
              fi
            done
          }

          verify_release_tag

          tag_version="${TAG#v}"
          tag_without_build="${tag_version%%+*}"
          expected_prerelease=false
          if [[ "$tag_without_build" == *-* ]]; then
            expected_prerelease=true
          fi

          shopt -s nullglob
          local_assets=(release/*)
          hidden_assets=(release/.[!.]* release/..?*)
          shopt -u nullglob
          (( ${#local_assets[@]} > 0 && ${#local_assets[@]} < 100 )) || {
            echo '::error::Release asset set is empty or exceeds the verification bound'
            exit 1
          }
          (( ${#hidden_assets[@]} == 0 )) || {
            echo '::error::Hidden release assets are not allowed'
            exit 1
          }
          declare -A local_paths=()
          declare -A local_sizes=()
          declare -A local_digests=()
          local_names=()
          local_manifest="$RUNNER_TEMP/openshield-local-release-manifest"
          : > "$local_manifest"
          for asset in "${local_assets[@]}"; do
            [[ -f "$asset" && ! -L "$asset" && -s "$asset" ]] || {
              echo "::error::Unsafe local release asset: $asset"
              exit 1
            }
            name="${asset##*/}"
            [[ "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._+~-]*$ ]] || {
              echo "::error::Unsafe local release asset name: $name"
              exit 1
            }
            [[ -z "${local_paths[$name]+present}" ]] || {
              echo "::error::Duplicate local release asset: $name"
              exit 1
            }
            size="$(stat -c '%s' -- "$asset")"
            read -r digest _ < <(sha256sum -- "$asset")
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || {
              echo "::error::Cannot hash local release asset: $name"
              exit 1
            }
            local_paths["$name"]="$asset"
            local_sizes["$name"]="$size"
            local_digests["$name"]="sha256:$digest"
            local_names+=("$name")
            printf '%s\t%s\tsha256:%s\n' "$name" "$size" "$digest" >> "$local_manifest"
          done
          sort -o "$local_manifest" "$local_manifest"
          read -r manifest_digest _ < <(sha256sum -- "$local_manifest")
          echo "Release manifest SHA-256: $manifest_digest"
          release_marker="<!-- openshield-release:v1 tag-ref=$EXPECTED_TAG_REF_SHA source=$SOURCE_SHA manifest=$manifest_digest -->"

          lookup_release
          if [[ -z "$release_node" ]]; then
            create_options=(
              "$TAG"
              --draft
              --verify-tag
              --generate-notes
              --notes "$release_marker"
              --title "OpenShield $TAG"
            )
            if [[ "$expected_prerelease" == true ]]; then
              create_options+=(--prerelease)
            fi
            create_status=0
            gh release create "${create_options[@]}" || create_status=$?
            if (( create_status != 0 )); then
              echo '::warning::Release creation failed; checking for a concurrently created draft'
            fi
            lookup_release
            if [[ -z "$release_node" ]]; then
              echo '::error::GitHub Release was not created'
              if (( create_status != 0 )); then
                exit "$create_status"
              fi
              exit 1
            fi
          fi

          read_release
          initial_release_id="$release_id"
          initial_release_node="$release_node"
          initial_release_was_draft="$release_is_draft"
          [[ "$release_is_prerelease" == "$expected_prerelease" ]] || {
            echo "::error::Existing release prerelease state does not match tag $TAG"
            exit 1
          }
          if [[ "$release_is_draft" == true ]] \
            && ! grep -Fqx -- "$release_marker" <<< "$release_body"; then
            echo '::error::Existing draft is not owned by this source and asset manifest'
            exit 1
          fi

          verify_release_identity() {
            local expected_draft_state=$1
            lookup_release || return 1
            [[ "$release_node" == "$initial_release_node" \
              && "$release_database_id" == "$initial_release_id" ]] || {
              echo '::error::GitHub release identity changed during publication'
              return 1
            }
            read_release || return 1
            [[ "$release_id" == "$initial_release_id" ]] || return 1
            [[ "$release_is_draft" == "$expected_draft_state" ]] || {
              echo '::error::GitHub release publication state changed unexpectedly'
              return 1
            }
            [[ "$release_is_prerelease" == "$expected_prerelease" ]] || {
              echo '::error::GitHub release prerelease state changed unexpectedly'
              return 1
            }
            if [[ "$initial_release_was_draft" == true ]] \
              && ! grep -Fqx -- "$release_marker" <<< "$release_body"; then
              echo '::error::GitHub release draft ownership marker changed'
              return 1
            fi
          }

          fetch_remote_assets
          compare_remote_assets
          if (( ${#missing_assets[@]} > 0 )); then
            [[ "$release_is_immutable" == false ]] || {
              echo '::error::Immutable release is missing expected assets'
              exit 1
            }
            if [[ "$initial_release_was_draft" == false \
              && "$ALLOW_PUBLISHED_REPAIR" != true ]]; then
              echo '::error::Published release is incomplete and this run is not authorized to repair it'
              exit 1
            fi
            verify_release_tag
            upload_response="$RUNNER_TEMP/openshield-release-upload-response.json"
            for name in "${missing_assets[@]}"; do
              verify_release_tag
              verify_release_identity "$initial_release_was_draft"
              echo "Uploading missing release asset: $name"
              # Never use --clobber here: gh deletes the existing asset before
              # uploading its replacement. Digest mismatches must require an
              # explicit operator decision instead of destructive recovery.
              encoded_name="$(jq -rn --arg name "$name" '$name | @uri')"
              curl --fail-with-body --silent --show-error \
                --request POST \
                --header 'Accept: application/vnd.github+json' \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header 'Content-Type: application/octet-stream' \
                --header 'X-GitHub-Api-Version: 2026-03-10' \
                --data-binary "@${local_paths[$name]}" \
                --output "$upload_response" \
                "${release_upload_url%%\{*}?name=$encoded_name"
              jq -e --arg name "$name" --argjson size "${local_sizes[$name]}" '
                (.name == $name) and (.size == $size) and (.state == "uploaded")
              ' "$upload_response" >/dev/null || {
                echo "::error::GitHub returned an invalid upload response for $name"
                exit 1
              }
            done
          fi

          read_release
          [[ "$release_id" == "$initial_release_id" ]] || {
            echo '::error::GitHub release identity changed during asset upload'
            exit 1
          }
          fetch_remote_assets
          compare_remote_assets
          (( ${#missing_assets[@]} == 0 )) || {
            echo '::error::GitHub release is still missing expected assets'
            exit 1
          }

          if [[ "$initial_release_was_draft" == true ]]; then
            verify_release_tag
            verify_release_identity true
            make_latest=legacy
            if [[ "$expected_prerelease" == true ]]; then
              make_latest=false
            fi
            gh api --method PATCH \
              -F draft=false \
              -F prerelease="$expected_prerelease" \
              -f make_latest="$make_latest" \
              "repos/$GITHUB_REPOSITORY/releases/$initial_release_id" >/dev/null
          fi

          verify_release_tag
          verify_release_identity false
          [[ "$release_id" == "$initial_release_id" && "$release_is_draft" == false ]] || {
            echo '::error::GitHub release was replaced or remains a draft'
            exit 1
          }
          [[ "$release_is_prerelease" == "$expected_prerelease" ]] || {
            echo '::error::Published release prerelease state changed unexpectedly'
            exit 1
          }
          fetch_remote_assets
          compare_remote_assets
          (( ${#missing_assets[@]} == 0 )) || {
            echo '::error::Published release asset verification failed'
            exit 1
          }
